<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
        }


        body {
            background-color: black;
        }

        .card {
            width: 250px;
            /* height: 400px; */
            border: 1px solid gray;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 20px;
            background-color: rgb(40, 35, 35);
            color: white;
            gap: 10px;
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            font-size: 25px;
        }

        button {
            padding: 8px 30px;
            border: none;
            border-radius: 10px;
            background-color: rgb(40, 35, 35);
            border: 1px solid gray;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        button:active {
            transform: scale(95%);
        }
    </style>
</head>

<body>

    <div class="card">
        <img id="myimg"
            src="https://images.unsplash.com/photo-1577975882846-431adc8c2009?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8Ym95JTIwaW1hZ2V8ZW58MHx8MHx8fDA%3D" />
        <div>
            <h1 id="name">mr ravi sharma</h1>
            <h1 id="gen">male</h1>
            <h1 id="age">age 15</h1>
        </div>
        <button id="btn">visit profile</button>
    </div>

    <script>
        let url = "https://randomuser.me/api/";
        let age = document.querySelector("#age");
        let name = document.querySelector("#name");
        let gen = document.querySelector("#gen");
        let myimg = document.querySelector("#myimg");
        let btn = document.querySelector("#btn");
        async function getUser() {
            let response = await fetch(url);
            let data = await response.json();
            data = data.results[0];
            console.log(data)
            gen.innerHTML = data.gender;
            name.innerHTML = data.name.title + " " + data.name.first + " " + data.name.last
            age.innerHTML = "age " + data.registered.age
            myimg.src = data.picture.medium
        }
        btn.addEventListener("click", getUser)
    </script>
</body>

</html>
