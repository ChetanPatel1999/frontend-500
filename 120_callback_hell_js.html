<script>
    function getData(id, getNextData) {
        setTimeout(() => {
            console.log("get data :" + id)
            if (getNextData) {
                getNextData();
            }
        }, 2000)
    }

    console.log("getting data1 ....")
    getData(101, () => {
        console.log("getting data2 ....")
        getData(102, () => {
            console.log("getting data3 ....")
            getData(103, () => {
                console.log("getting data4 ....")
                getData(104, () => {
                    console.log("getting data5 ....")
                    getData(105)
                })
            })
        })
    });





</script>
