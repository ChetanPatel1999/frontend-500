<!-- 
    Async-Await
    async function always returns a promise.
    async function myFunc( ) { .... }
    await pauses the execution of its surrounding async function until the promise is settled 
    -->
<script>

    function WeatherApi1() {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                console.log("weather data 101 fatched")
                resolve(200)
            }, 2000)
        })
    }
    function WeatherApi2() {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                console.log("weather data 102 fatched")
                resolve(200)
            }, 2000)
        })
    }
    function WeatherApi3() {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                console.log("weather data 103 fatched")
                resolve(200)
            }, 2000)
        })
    }

    async function getWatherData() {
        console.log("getting data1 ....")
        await WeatherApi1()
        console.log("getting data2 ....")
        await WeatherApi2()
        console.log("getting data3 ....")
        await WeatherApi3()
    }

    getWatherData()
</script>
